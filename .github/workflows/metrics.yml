name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LUMA-GANG
          template: classic
          filename: profile/assets/metrics.svg
          committer_message: "chore: update org metrics [skip ci]"
          base: ""
          config_timezone: America/Mexico_City
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_lines: yes
